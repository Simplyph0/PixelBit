name: Build firmware

# Every push to main that changes the firmware is tested, built and published as
# a release (vX.Y-build.N) whose notes list the commits since the last release.
# Every release has two files: the firmware, and the same firmware with FLIPPED_BUTTONS set
# to 1 (PixelBit-<release>-flipped.bin) for a board built upside down.
# Pushing a tag like v4.2 publishes that version instead, with the tag's own
# message as the notes; a main push whose commit carries such a tag leaves the
# release to the tag.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "GameSystem/**"
      - "tools/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "GameSystem/**"
      - "tools/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  shell: bash }
          - { os: macos-latest,   shell: bash }
          - { os: windows-latest, shell: "msys2 {0}" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      # Windows builds with MinGW-w64 from MSYS2; SDL2 is installed everywhere so
      # the emulator's window code is compiled too
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-python

      - name: Install SDL2 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev ninja-build

      - name: Install SDL2 (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2 ninja

      - name: Build the emulator and the tests
        run: |
          cmake -S tools -B build/tools -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/tools -- -k 0   # keep going after an error, so one run shows every failure

      - name: Run the tests
        run: ctest --test-dir build/tools --output-on-failure

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the whole history, for the changelog

      - name: Fetch the tags with their messages
        run: git fetch --tags --force

      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP8266 core and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli lib update-index
          arduino-cli core install esp8266:esp8266@3.1.2
          arduino-cli lib install "Adafruit GFX Library" "Adafruit SSD1306" "Adafruit BusIO"

      - name: Compile
        # eesz=4M2M is "4MB (FS:2MB OTA:~1019KB)", the IDE's default; it is written out so the
        # videos' file system sits in the same place whatever the core's default is
        run: arduino-cli compile --fqbn esp8266:esp8266:d1_mini:eesz=4M2M --output-dir build GameSystem

      - name: Compile the flipped-buttons version
        # The same firmware with FLIPPED_BUTTONS set to 1 (config.h lets the compiler override it)
        run: >-
          arduino-cli compile --fqbn esp8266:esp8266:d1_mini:eesz=4M2M
          --build-property "compiler.cpp.extra_flags=-DFLIPPED_BUTTONS=1"
          --build-path /tmp/pixelbit-flipped --output-dir build-flipped GameSystem

      - name: Work out the release
        id: rel
        run: |
          ver=$(grep -oP '#define OS_VERSION "\K[^"]+' GameSystem/config.h | head -1)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
            publish=true
          elif [[ "$GITHUB_EVENT_NAME" == push ]]; then
            tag="${ver}-build.${GITHUB_RUN_NUMBER}"
            # a version tag on this very commit publishes it instead
            if git tag --points-at HEAD | grep -q '^v'; then publish=false; else publish=true; fi
          else
            tag="${ver}-test"
            publish=false
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Name the files and make checksums
        run: |
          tag="${{ steps.rel.outputs.tag }}"
          cp build-flipped/GameSystem.ino.bin "build/PixelBit-${tag}-flipped.bin"
          cd build
          mv GameSystem.ino.bin "PixelBit-${tag}.bin"
          sha256sum PixelBit-*.bin | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PixelBit-${{ steps.rel.outputs.tag }}
          path: |
            build/PixelBit-*.bin
            build/SHA256SUMS.txt

      - name: Write the release notes
        if: steps.rel.outputs.publish == 'true'
        run: |
          tag="${{ steps.rel.outputs.tag }}"
          # The CHANGELOG.md section for this version: "## <tag>" for a tagged release,
          # "## Unreleased" for a build from main
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then heading="$tag"; else heading="Unreleased"; fi
          awk -v h="## $heading" '/^## /{p = (tolower($0) == tolower(h)); next} p' CHANGELOG.md > changelog.md
          {
            if grep -q '[^[:space:]]' changelog.md; then
              echo "## What's new"
              cat changelog.md
              echo
            fi
          } > notes.md
          if [[ "$GITHUB_REF" == refs/tags/* ]] && [ "$(git cat-file -t "$tag")" = tag ]; then
            git tag -l --format='%(contents)' "$tag" >> notes.md    # an annotated tag: its message
          else
            prev=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
            {
              echo "## Commits since ${prev:-the start}"
              echo
              git log --no-merges --format='- %s (%h)' ${prev:+$prev..}HEAD
            } >> notes.md
          fi
          {
            echo
            echo "**Which file?** \`PixelBit-${tag}.bin\` is for a board wired as in the README. \`PixelBit-${tag}-flipped.bin\` is the same firmware for a board built upside down, with every button in the opposite place."
            echo
            echo "SHA-256:"
            awk '{print "- `" $2 "`: `" $1 "`"}' build/SHA256SUMS.txt
          } >> notes.md
          cat notes.md

      - name: Publish the release
        if: steps.rel.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.rel.outputs.tag }}"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" build/PixelBit-*.bin build/SHA256SUMS.txt --clobber
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "PixelBit $tag" \
              --notes-file notes.md build/PixelBit-*.bin build/SHA256SUMS.txt
          fi
