name: Build firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP8266 core and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266@3.1.2
          arduino-cli lib install "Adafruit GFX Library" "Adafruit SSD1306" "Adafruit BusIO"

      - name: Compile
        run: arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 --output-dir build GameSystem

      - name: Name the file and make a checksum
        run: |
          cd build
          mv GameSystem.ino.bin PixelBit-${GITHUB_REF_NAME//\//-}.bin
          sha256sum PixelBit-*.bin | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PixelBit-firmware
          path: |
            build/PixelBit-*.bin
            build/SHA256SUMS.txt

      - name: Work out the release tag
        if: github.event_name == 'push'
        id: rel
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            ver=$(grep -oP '#define OS_VERSION "\K[^"]+' GameSystem/config.h | head -1)
            echo "tag=${ver}-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release with changelog
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: PixelBit ${{ steps.rel.outputs.tag }}
          generate_release_notes: true
          files: |
            build/PixelBit-*.bin
            build/SHA256SUMS.txt
